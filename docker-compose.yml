version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: fruitaste-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: fruitaste
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fruitaste"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fruitaste-network

  # 2. pgAdmin Database UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fruitaste-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fruitaste.com
      PGADMIN_DEFAULT_PASSWORD: "123456"
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
      PGPASS_FILE: /pgadmin4/pgpass
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
    networks:
      - fruitaste-network

  # 3. NestJS Backend Service
  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fruitaste-backend
    restart: always
    ports:
      - "8000:8000"
    # Load all environment variables (including email secrets) from local backend/.env
    env_file:
      - ./backend/.env
    # Override only variables that need routing inside the Docker network
    environment:
      DATABASE_URL: "postgresql://admin:123456@165.227.35.109:5432/fruitaste?schema=public&sslmode=require"
      FRONTEND_URL: "http://localhost:3000"
    command: sh -c "npx prisma db push && npm run start:prod"
    networks:
      - fruitaste-network

  # 4. Next.js Frontend Service
  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    container_name: fruitaste-frontend
    restart: always
    ports:
      - "3000:3000"
    # Load all environment variables (Google, Resend, Groq keys) from local frontend/.env
    env_file:
      - ./frontend/.env
    # Override only variables that need routing inside the Docker network
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
    depends_on:
      - backend-service
    networks:
      - fruitaste-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  fruitaste-network:
    driver: bridge
